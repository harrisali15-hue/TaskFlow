<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TaskFlow</title>

<style>

:root{
--bg:#dff6ff;
--bg2:#b8e8ff;
--text:#083344;
--glass:rgba(255,255,255,.35);
--glass2:rgba(255,255,255,.65);
--border:rgba(255,255,255,.4);
--shadow:rgba(0,0,0,.12);
}

body.dark{
--bg:#081b29;
--bg2:#102b42;
--text:#eaf6ff;
--glass:rgba(255,255,255,.08);
--glass2:rgba(255,255,255,.12);
--border:rgba(255,255,255,.15);
--shadow:rgba(0,0,0,.35);
}

*{
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
margin:0;
background:linear-gradient(135deg,var(--bg),var(--bg2));
color:var(--text);
min-height:100vh;
}

.header{
padding:25px;
font-size:42px;
font-weight:800;
text-align:center;
}

.topbar{
display:flex;
justify-content:center;
gap:12px;
flex-wrap:wrap;
padding:0 20px 20px;
}

.search{
width:60%;
max-width:700px;
min-width:250px;
padding:14px;
border:none;
border-radius:16px;
background:var(--glass2);
color:var(--text);
outline:none;
}

button{
border:none;
padding:14px 18px;
border-radius:16px;
cursor:pointer;
background:var(--glass2);
color:var(--text);
font-weight:700;
}

.stats{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:16px;
padding:0 20px 20px;
}

.stat{
width:220px;
padding:18px;
border-radius:20px;
background:var(--glass);
backdrop-filter:blur(12px);
text-align:center;
}

.statnum{
font-size:24px;
font-weight:800;
margin-top:8px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,300px);
justify-content:center;
gap:20px;
padding:20px;
}

.card{
border-radius:24px;
padding:18px;
backdrop-filter:blur(12px);
border:1px solid var(--border);
box-shadow:0 8px 20px var(--shadow);
}

.normal{background:#2aa9ff33;}
.soon{background:#ffc10755;}
.urgent{background:#ff8c0033;}
.overdue{background:#ff3b3044;}
.completed{background:#9e9e9e55;}

.taskTitle{
font-size:24px;
font-weight:800;
margin-bottom:10px;
}

.info{
margin:6px 0;
font-size:14px;
}

.fab{
position:fixed;
bottom:25px;
right:25px;
width:70px;
height:70px;
border-radius:50%;
font-size:36px;
}

.popup{
position:fixed;
inset:0;
display:none;
justify-content:center;
align-items:center;
background:rgba(0,0,0,.4);
}

.popupbox{
width:380px;
max-width:95%;
padding:20px;
border-radius:24px;
background:var(--glass2);
display:flex;
flex-direction:column;
gap:12px;
}

input,select,textarea{
padding:12px;
border:none;
border-radius:12px;
background:white;
}

body.dark input,
body.dark select,
body.dark textarea{
background:#18364d;
color:white;
}

textarea{
resize:none;
}

.row{
display:flex;
gap:10px;
}

.row>*{
flex:1;
}

.legend{
display:flex;
justify-content:center;
gap:14px;
flex-wrap:wrap;
padding:10px 20px;
font-size:14px;
}

.dot{
width:12px;
height:12px;
border-radius:50%;
display:inline-block;
margin-right:6px;
}

.blue{background:#00aaff;}
.yellow{background:#ffc107;}
.orange{background:#ff9800;}
.red{background:#ff3b30;}
.grey{background:#9e9e9e;}

</style>
</head>

<body>

<div class="header">
TaskFlow
</div>

<div class="topbar">

<input
id="search"
class="search"
placeholder="Search tasks..."
>

<button onclick="toggleTheme()">
🌙 Theme
</button>

</div>

<div class="stats">

<div class="stat">
<div>Next Deadline</div>
<div class="statnum" id="nextDeadline">None</div>
</div>

<div class="stat">
<div>Tasks Pending</div>
<div class="statnum" id="pendingCount">0</div>
</div>

<div class="stat">
<div>Due Today</div>
<div class="statnum" id="dueToday">0</div>
</div>

<div class="stat">
<div>Overdue</div>
<div class="statnum" id="overdueCount">0</div>
</div>

</div>

<div class="legend">
<div><span class="dot blue"></span>Normal</div>
<div><span class="dot yellow"></span>Soon</div>
<div><span class="dot orange"></span>Urgent</div>
<div><span class="dot red"></span>Overdue</div>
<div><span class="dot grey"></span>Completed</div>
</div>

<div class="grid" id="grid"></div>

<button class="fab" onclick="openPopup()">
+
</button>

<div class="popup" id="popup">

<div class="popupbox">

<input id="taskName" placeholder="Task Name">

<div class="row">

<select id="classification"></select>

<button onclick="addClassification()">
+
</button>

</div>

<select id="priority">
<option>Low</option>
<option>Medium</option>
<option>High</option>
<option>Critical</option>
</select>

<input type="date" id="taskDate">

<input type="time" id="taskTime">

<textarea
id="notes"
rows="4"
placeholder="Notes..."
></textarea>

<div class="row">

<button onclick="saveTask()">
Save
</button>

<button onclick="closePopup()">
Cancel
</button>

</div>

</div>

</div>

<script>

let tasks =
JSON.parse(localStorage.getItem("tasks")) || [];

let classifications =
JSON.parse(localStorage.getItem("classifications")) || [
"Personal"
];

const grid = document.getElementById("grid");
const taskName = document.getElementById("taskName");
const classification = document.getElementById("classification");
const priority = document.getElementById("priority");
const taskDate = document.getElementById("taskDate");
const taskTime = document.getElementById("taskTime");
const notes = document.getElementById("notes");
const search = document.getElementById("search");

function saveData(){
localStorage.setItem(
"tasks",
JSON.stringify(tasks)
);

localStorage.setItem(
"classifications",
JSON.stringify(classifications)
);
}

function loadClassifications(){

const select =
document.getElementById("classification");

select.innerHTML="";

classifications.forEach(c=>{

select.innerHTML +=
`<option>${c}</option>`;

});

}

loadClassifications();

function addClassification(){

const name =
prompt("New Classification:");

if(!name) return;

classifications.push(name);

saveData();

loadClassifications();

}

function openPopup(){
document.getElementById("popup").style.display="flex";
}

function closePopup(){
document.getElementById("popup").style.display="none";
}

function saveTask(){

const task = {
id:crypto.randomUUID(),
name:taskName.value,
classification:classification.value,
priority:priority.value,
date:taskDate.value,
time:taskTime.value,
notes:notes.value,
created:new Date().toLocaleString(),
completed:false
};

tasks.push(task);

saveData();

render();

closePopup();

taskName.value="";
notes.value="";
}

function getStatus(task){

if(task.completed)
return "completed";

const deadline =
new Date(task.date+"T"+task.time);

const now = new Date();

const diff =
(deadline-now)/(1000*60*60);

if(diff<0)
return "overdue";

if(diff<=6)
return "urgent";

if(diff<=24)
return "soon";

return "normal";

}

function render(){

const q =
search.value.toLowerCase();

grid.innerHTML="";

let pending=0;
let overdue=0;
let dueToday=0;

const today =
new Date().toDateString();

tasks
.filter(t =>
t.name.toLowerCase().includes(q)
)
.sort((a,b) =>
Number(a.completed) - Number(b.completed)
)
.forEach(task=>{

const status =
getStatus(task);

if(!task.completed)
pending++;

if(
!task.completed &&
status === "overdue"
){
overdue++;
}

if(
!task.completed &&
new Date(task.date).toDateString() === today
){
dueToday++;
}

grid.innerHTML += `

<div class="card ${status}">

<div class="taskTitle">
${task.name}
</div>

<div class="info">
📚 ${task.classification}
</div>

<div class="info">
⚡ ${task.priority}
</div>

<div class="info">
📅 ${task.date}
</div>

<div class="info">
🕒 ${task.time}
</div>

<div class="info">
📝 ${task.notes}
</div>

<div class="info">
Created:
${task.created}
</div>

<br>

<button onclick="completeTask('${task.id}')">
Complete
</button>

</div>

`;

});

document.getElementById(
"pendingCount"
).innerText = pending;

document.getElementById(
"overdueCount"
).innerText = overdue;

document.getElementById(
"dueToday"
).innerText = dueToday;

updateNextDeadline();

}

function removeExpiredTasks(){

const limit = 3 * 24 * 60 * 60 * 1000;

tasks = tasks.filter(t => {

if(!t.completed) return true;

if(!t.completedAt) return false;

return (Date.now() - t.completedAt) < limit;

});

saveData();
}

function updateNextDeadline(){

const upcoming =
tasks
.filter(t=>!t.completed)
.sort((a,b)=>
new Date(a.date+"T"+a.time)
-
new Date(b.date+"T"+b.time)
);

document.getElementById(
"nextDeadline"
).innerText =
upcoming.length
? upcoming[0].name
: "None";

}

function completeTask(id){

const task =
tasks.find(t=>t.id===id);

if(!task) return;

task.completed = true;
task.completedAt = Date.now();

saveData();

render();

}

function toggleTheme(){

document.body.classList.toggle("dark");

localStorage.setItem(
"theme",
document.body.classList.contains("dark")
? "dark"
: "light"
);

}

if(
localStorage.getItem("theme")
==="dark"
){
document.body.classList.add("dark");
}

search.addEventListener(
"input",
render
);

removeExpiredTasks();
render();

</script>

</body>
</html>
